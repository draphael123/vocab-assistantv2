<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vocab Extender — New Tab</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Source Serif 4', Georgia, serif;
      background: #FAF8F6;
      color: #1A1714;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      padding: 32px;
      background: white;
      border-radius: 16px;
      border: 1px solid rgba(26,23,20,0.1);
      text-align: center;
    }
    .label { font-size: 12px; color: #6B6560; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .word { font-family: 'Fraunces', Georgia, serif; font-size: 36px; color: #1E5F74; font-weight: 600; margin-bottom: 8px; }
    .phonetic { font-size: 14px; color: #6B6560; font-style: italic; margin-bottom: 16px; }
    .def { font-size: 15px; line-height: 1.6; color: #1A1714; margin-bottom: 24px; }
    a {
      display: inline-block;
      padding: 10px 20px;
      background: #1E5F74;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
    }
    a:hover { background: #164D5E; }
    .loading { color: #6B6560; }
  </style>
</head>
<body>
  <div class="card">
    <p class="label">Today's word</p>
    <h1 class="word" id="word">…</h1>
    <p class="phonetic" id="phonetic"></p>
    <p class="def" id="def"></p>
    <a href="#" id="openExt">Open extension →</a>
  </div>
  <script src="newtab.js"></script>
</body>
</html>
