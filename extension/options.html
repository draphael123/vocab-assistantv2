<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Extender — Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Source Serif 4', Georgia, serif;
      background: #FAF8F6;
      color: #1A1714;
      padding: 24px;
      max-width: 480px;
      line-height: 1.6;
    }
    h1 { font-size: 20px; margin-bottom: 20px; color: #1E5F74; }
    .field { margin-bottom: 20px; }
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    select {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid rgba(26,23,20,0.15);
      border-radius: 8px;
      background: white;
    }
    .hint { font-size: 12px; color: #6B6560; margin-top: 6px; }
    button {
      padding: 10px 20px;
      font-size: 14px;
      font-family: inherit;
      background: #1E5F74;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #164D5E; }
    .saved { font-size: 12px; color: #047857; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Vocab Extender Settings</h1>
  <div class="field">
    <label for="theme">Theme</label>
    <select id="theme">
      <option value="light">Light (cream/teal)</option>
      <option value="dark">Dark</option>
    </select>
    <p class="hint">Choose popup theme. Light matches the website.</p>
  </div>
  <div class="field">
    <label for="reminder">Daily reminder</label>
    <select id="reminder">
      <option value="off">Off</option>
      <option value="9">9:00 AM</option>
      <option value="12">12:00 PM</option>
      <option value="18">6:00 PM</option>
    </select>
    <p class="hint">Optional notification to review today's word.</p>
  </div>
  <button id="save">Save</button>
  <p class="saved" id="savedMsg" style="display:none">Saved.</p>
  <script src="options.js"></script>
</body>
</html>
