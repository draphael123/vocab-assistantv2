<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Extender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="root">
    <header class="popup-header">
      <div class="popup-logo">
        <span class="popup-logo-icon">V</span>
        <span class="popup-logo-name">Vocab Extender</span>
      </div>
      <span class="popup-date" id="dateLabel">—</span>
    </header>
    <div class="popup-tabs">
      <button type="button" class="popup-tab active" data-tab="word">Today</button>
      <button type="button" class="popup-tab" data-tab="quiz">Quiz</button>
      <button type="button" class="popup-tab" data-tab="saved">Saved</button>
      <button type="button" class="popup-tab" data-tab="past">Past</button>
      <button type="button" class="popup-tab" data-tab="search">Search</button>
    </div>
    <main class="popup-body">
      <div id="panel-word" class="panel active">
        <div class="word-row">
          <div>
            <h1 class="word-title" id="wordTitle">Loading…</h1>
            <span class="word-tier" id="wordTier">—</span>
          </div>
          <button type="button" class="btn-bookmark" id="btnBookmark" title="Save word" aria-label="Save word">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </button>
        </div>
        <p class="phonetic" id="phonetic">—</p>
        <div class="word-actions">
          <button type="button" class="btn-copy" id="btnCopy" title="Copy word & definition">Copy</button>
          <button type="button" class="btn-random" id="btnRandom" title="Random word">Shuffle</button>
        </div>
        <div class="definitions" id="definitions"></div>
        <div class="audio-row" id="audioRow"></div>
        <div class="synonyms-row" id="synonymsRow"></div>
        <div class="examples" id="examples"></div>
      </div>
      <div id="panel-quiz" class="panel">
        <p class="quiz-prompt" id="quizPrompt">What does <strong id="quizWord">—</strong> mean?</p>
        <div class="quiz-options" id="quizOptions"></div>
        <div class="quiz-feedback" id="quizFeedback"></div>
        <p class="quiz-streak" id="quizStreak">Streak: 0</p>
        <p class="quiz-saved-link" id="quizSavedLink" style="display:none"><button type="button" class="btn-link">Or quiz a saved word</button></p>
        <p class="quiz-hint" id="quizShortcutHint">Press 1–4 to select an answer.</p>
      </div>
      <div id="panel-saved" class="panel">
        <div class="stats-row" id="statsRow"></div>
        <input type="search" class="search-saved" id="searchSaved" placeholder="Search saved words…" />
        <button type="button" class="btn-export" id="exportSaved">Export saved words</button>
        <button type="button" class="btn-calendar" id="btnCalendar">Add to calendar</button>
        <ul class="saved-list" id="savedList"></ul>
      </div>
      <div id="panel-past" class="panel">
        <p class="panel-hint">Words from previous days</p>
        <ul class="past-list" id="pastList"></ul>
      </div>
      <div id="panel-search" class="panel">
        <input type="search" class="search-all" id="searchAll" placeholder="Search all words…" />
        <ul class="search-results" id="searchResults"></ul>
      </div>
    </main>
  </div>
  <div id="savedWordModal" class="modal" role="dialog" aria-labelledby="savedWordTitle" aria-modal="true">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button type="button" class="modal-close" id="savedWordClose" aria-label="Close">✕</button>
      <div id="savedWordContent"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
